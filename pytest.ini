[pytest]
# Основні параметри запуску
addopts = -s -v --tb=short

# Шляхи до папок з тестами
testpaths = tests

# Реєстрація маркерів для уникнення PytestUnknownMarkWarning
markers =
    smoke: Критичні smoke-тести
    regression: Повний регресійний набір
    auth: Тести авторизації та реєстрації
    category: Тести на сторінці категорії
    download: Тести завантаження шаблонів
    ads: tests that need real ads
    all_templates: all templates tests

# Шаблони пошуку файлів та функцій
python_files = test_*.py
python_classes = Test*
python_functions = test_*