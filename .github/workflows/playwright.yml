name: Playwright Tests
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: playwright
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write          # для публікації результатів у Checks
    env:
      API_KEY: ${{ secrets.API_KEY }}
      GATEWAY_URL: ${{ vars.GATEWAY_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      TEST_USER_EMAIL_REGISTRATION: ${{ vars.TEST_USER_EMAIL_REGISTRATION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get admin token
        run: |
          TOKEN=$(python scripts/get_token.py)
          echo "::add-mask::$TOKEN"
          echo "ADMIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium   # лише те, що потрібно, швидше

      - name: Parallel tests
        run: >
          pytest -m "smoke and not serial" -n 2
          --tracing=retain-on-failure
          --screenshot=only-on-failure
          --video=retain-on-failure
          --output=test-results
          --html=report/index.html --self-contained-html
          --junitxml=report/junit-parallel.xml

      - name: Serial tests
        if: ${{ !cancelled() }}
        run: >
          pytest -m "smoke and serial"
          --tracing=retain-on-failure
          --screenshot=only-on-failure
          --video=retain-on-failure
          --output=test-results
          --html=report/index.html --self-contained-html
          --junitxml=report/junit-serial.xml

      - name: Publish summary in Checks
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: report/junit-*.xml
          check_name: Playwright smoke results
          detailed_summary: true      # таблиця по кожному тесту
          include_passed: true        # показувати й пройдені (за замовчуванням лише падіння)
          summary: true               # підсумок також у Summary запуску

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: report/
          retention-days: 30

      - name: Upload failure artifacts (trace/video/screenshots)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
